name: Robot shopper

# Every 30 min: the top products, phone + laptop, Design Center -> upload ->
# Add to cart -> storefront cart -> Shopify checkout loads (HTTP 200, never
# pays). Nightly: the full catalog + the bulk-quote /pay check.
# Public repo = free GitHub Actions minutes. The only secrets (robot cookie,
# a send-only email key) are repo secrets, never exposed to forks.
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 10 * * *'   # 3am Pacific — full catalog
  workflow_dispatch:
    inputs:
      set:
        description: core or full
        default: core
      bulk_quote:
        description: also run the daily bulk-quote pay check
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  shop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - name: Test artwork (jpg / heic / pdf)
        run: pip install -q pillow pillow-heif && python3 gen-art.py
      - name: Shop
        id: shop
        continue-on-error: true
        env:
          ROBOT_TOKEN: ${{ secrets.ROBOT_TOKEN }}
          ROBOT_CONCURRENCY: 4
          ROBOT_SET: ${{ github.event.schedule == '0 10 * * *' && 'full' || inputs.set || 'core' }}
          # Daily bulk-quote pay check rides the nightly full run (no new job).
          ROBOT_BULK_QUOTE_TOKEN: ${{ secrets.ROBOT_BULK_QUOTE_TOKEN }}
          ROBOT_BULK_QUOTE: ${{ inputs.bulk_quote && '1' || '' }}
        run: node robot.mjs
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: node alert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: out/
          retention-days: 7
          if-no-files-found: ignore
